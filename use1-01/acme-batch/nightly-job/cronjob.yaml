apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-job
  labels:
    app.kubernetes.io/name: nightly-job
    app.kubernetes.io/part-of: acme-batch
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nightly-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly-job
              image: public.ecr.aws/docker/library/busybox:1.36
              command: ["sh", "-c", "echo running nightly job for acme-batch; sleep 5"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi